<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Character Counter & Dark Mode</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>Live Character Counter</h1>
    
    <div class="note-box">
      <label for="note-text">Your Note:</label>
      <textarea id="note-text" placeholder="Type your note here..."></textarea>
      
      <div class="counter-display">
        <p id="char-count">0 / 200 characters</p>
        <p id="word-count">0 words</p>
      </div>

      <div class="button-group">
        <button id="clear-btn">Clear</button>
        <button id="theme-toggle">Dark mode</button>
      </div>
    </div>
  </main>
</body>
</html>
